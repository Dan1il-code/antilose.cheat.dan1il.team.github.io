<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntiLOSE</title>
    <style>
        /* Убираем отступы и задаём базовые параметры */
        body {
            margin: 0;
            padding: 0;
            background-color: #050505; /* Почти чёрный фон для глубины */
            /* Создаём паттерн из красных точек с помощью радиального градиента */
            background-image: radial-gradient(#ff1a1a 1.5px, transparent 1.5px);
            background-size: 30px 30px; /* Расстояние между точками */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        /* Стиль заголовка */
        h1 {
            font-size: 4rem;
            margin: 0 0 2rem 0;
            letter-spacing: 6px;
            text-transform: uppercase;
            /* Красное неоновое свечение */
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8), 0 0 20px rgba(255, 0, 0, 0.4);
        }

        /* Стиль кнопки */
        .download-btn {
            display: inline-block;
            padding: 16px 48px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #cc0000;
            border: 2px solid #ff3333;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Эффект при наведении на кнопку */
        .download-btn:hover {
            background-color: #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            transform: translateY(-3px);
        }

        /* Эффект при нажатии */
        .download-btn:active {
            transform: translateY(1px);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        /* Адаптация для мобильных устройств */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
                letter-spacing: 3px;
            }
            .download-btn {
                padding: 14px 36px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <h1>AntiLOSE</h1>
    
    <!-- Кнопка с вашей ссылкой на Google Диск -->
    <a href="https://drive.usercontent.google.com/download?id=1-R1mIDWXIkMFQQCcmjQTIoDk0Vj_SGXY&export=download&authuser=0" 
       class="download-btn" 
       target="_blank" 
       rel="noopener noreferrer">
       Download
    </a>

</body>
</html>
